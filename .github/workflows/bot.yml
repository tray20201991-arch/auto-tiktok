name: TikTok Auto
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pyTelegramBotAPI requests
      - run: python bot.py
